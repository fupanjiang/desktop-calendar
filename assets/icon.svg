<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D2D3A"/>
      <stop offset="100%" stop-color="#1C1C26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#4834D4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 主体卡片 -->
  <rect x="36" y="42" width="184" height="188" rx="20" ry="20" fill="url(#body)" filter="url(#shadow)" stroke="#3A3A4A" stroke-width="1.5"/>

  <!-- 顶部装饰条 -->
  <rect x="36" y="42" width="184" height="48" rx="20" ry="20" fill="url(#accent)"/>
  <rect x="36" y="66" width="184" height="24" fill="url(#accent)"/>

  <!-- 圆点装饰（红绿灯风格） -->
  <circle cx="64" cy="66" r="6" fill="#FF5E57" opacity="0.9"/>
  <circle cx="82" cy="66" r="6" fill="#FFBD2E" opacity="0.9"/>
  <circle cx="100" cy="66" r="6" fill="#28CA41" opacity="0.9"/>

  <!-- 日历内容区 -->
  <!-- 星期标签 -->
  <g fill="#6C5CE7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle" opacity="0.8">
    <text x="58" y="118">日</text>
    <text x="84" y="118">一</text>
    <text x="110" y="118">二</text>
    <text x="136" y="118">三</text>
    <text x="162" y="118">四</text>
    <text x="188" y="118">五</text>
    <text x="214" y="118">六</text>
  </g>

  <!-- 日期数字（大号，高亮显示） -->
  <text x="128" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" fill="#FFFFFF" letter-spacing="-2">24</text>

  <!-- 底部发光圆点 -->
  <circle cx="110" cy="194" r="4" fill="#6C5CE7" filter="url(#glow)"/>
  <circle cx="128" cy="194" r="6" fill="#FFBD2E" filter="url(#glow)"/>
  <circle cx="146" cy="194" r="4" fill="#28CA41" filter="url(#glow)"/>
</svg>
